name: Aill Suite Build

on:
  push:
    branches:
      - chatgpt/aill-suite-build-20260731
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AillGameplaySuite/src/AillGameplaySuite/AillGameplaySuite.csproj

      - name: Build
        run: dotnet build AillGameplaySuite/src/AillGameplaySuite/AillGameplaySuite.csproj -c Release --no-restore

      - name: Assemble module
        shell: pwsh
        run: |
          $root = "artifact/AillGameplaySuite"
          New-Item -ItemType Directory -Force "$root/bin/Win64_Shipping_Client" | Out-Null
          Copy-Item "AillGameplaySuite/module/SubModule.xml" "$root/SubModule.xml"
          Copy-Item "AillGameplaySuite/src/AillGameplaySuite/bin/Release/net472/AillGameplaySuite.dll" "$root/bin/Win64_Shipping_Client/AillGameplaySuite.dll"
          Copy-Item "AillGameplaySuite/README.md" "$root/README.md"

      - uses: actions/upload-artifact@v4
        with:
          name: AillGameplaySuite-v0.1.0
          path: artifact/AillGameplaySuite
          if-no-files-found: error

  repack-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILRepack tool payload
        run: dotnet tool install --tool-path .tool dotnet-ilrepack --version 2.0.46

      - name: Publish self-contained host
        run: dotnet publish tools/RepackHost/RepackHost.csproj -c Release -r linux-x64 --self-contained true -o artifact/repackhost

      - name: Copy ILRepack managed payload
        shell: bash
        run: |
          mkdir -p artifact/repackhost/toolpayload
          find .tool -type f -name '*.dll' -print0 | while IFS= read -r -d '' f; do cp -n "$f" artifact/repackhost/toolpayload/; done
          chmod +x artifact/repackhost/RepackHost
          find artifact/repackhost -maxdepth 2 -type f -printf '%P %s\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: AillRepackHost-linux-x64
          path: artifact/repackhost
          if-no-files-found: error
